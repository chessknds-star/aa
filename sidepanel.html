<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Volt — Chat</title><link rel="stylesheet" href="sidepanel.css"></head><body><div class="sp-shell"><header class="sp-header"><div class="sp-brand"><span class="sp-logo" aria-hidden="true">⚡</span><div class="sp-brand-text"><h1 class="sp-title" data-i18n="title">Chat de la communauté</h1><p class="sp-subtitle"><span id="sp-tab-label">Global</span> · <span id="sp-status" class="sp-status"><span class="sp-dot" aria-hidden="true"></span><span id="sp-status-text" data-i18n="status.connecting">Connexion…</span></span></p></div></div><div class="sp-tabs" role="tablist" aria-label="Chat"><button class="sp-tab active" id="sp-tab-global" type="button" role="tab" aria-selected="true" data-i18n="tab.global">Global</button><button class="sp-tab" id="sp-tab-dm" type="button" role="tab" aria-selected="false" data-i18n="tab.dm">Messages privés</button></div></header><div id="sp-offline" class="sp-offline" hidden role="alert"><span data-i18n="offline">Connexion perdue — nouvelle tentative…</span></div><div id="sp-dm-back" class="sp-dm-back" hidden><button id="sp-dm-back-btn" class="sp-dm-back-btn" type="button" data-i18n="dm.back">← Conversations</button><span id="sp-dm-back-title" class="sp-dm-back-title"></span></div><main id="sp-messages" class="sp-messages" role="log" aria-live="polite" aria-label="Messages"><div class="sp-loading"><span class="sp-spinner" aria-hidden="true"></span><span data-i18n="loading">Chargement des messages…</span></div></main><div id="sp-conversations" class="sp-conversations" hidden aria-label="Conversations privées"></div><footer class="sp-footer"><div id="sp-auth-required" class="sp-auth-required" hidden><p data-i18n="loginRequired">Connecte-toi pour participer au chat.</p></div><div id="sp-compose" class="sp-compose" hidden><textarea id="sp-input" class="sp-input" rows="1" maxlength="500" placeholder="" data-i18n-placeholder="placeholder" aria-label="Message"></textarea><button id="sp-send" class="sp-send" type="button" aria-label="Envoyer" title="Envoyer (Entrée)" data-i18n-title="sendTitle" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div><div class="sp-meta"><span id="sp-charcount" class="sp-charcount">0/500</span><span id="sp-slowmode" class="sp-slowmode" hidden></span></div></footer></div><script src="sidepanel.js"></script></body></html>
